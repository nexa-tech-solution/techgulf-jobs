# Runs the daily job sync and email. 03:00 UTC is 07:00 in Dubai.
# Needs repository secrets: FIREBASE_SERVICE_ACCOUNT (the JSON file's contents), GMAIL_USER, GMAIL_APP_PASSWORD.
name: Daily jobs
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write Firebase credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node scripts/daily.mjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
